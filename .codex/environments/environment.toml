version = 1
name = "Assistant"

[setup]
script = '''
: "${CODEX_SOURCE_TREE_PATH:?CODEX_SOURCE_TREE_PATH is required}"
: "${CODEX_WORKTREE_PATH:?CODEX_WORKTREE_PATH is required}"

source_file="${CODEX_SOURCE_TREE_PATH}/.env"
target_file="${CODEX_WORKTREE_PATH}/.env"

if [ -f "${source_file}" ] && [ ! -e "${target_file}" ] && [ ! -L "${target_file}" ]; then
  ln -s "${source_file}" "${target_file}"
fi

cd "${CODEX_WORKTREE_PATH}"
corepack pnpm install --frozen-lockfile
'''
